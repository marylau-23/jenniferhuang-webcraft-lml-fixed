<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Sketchboard - LML Design Studio" />
    <title>涂鸦板 - LML Design Studio</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="256x256" />
    <link rel="preload" href="/fonts/neuemontreal-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/neuemontreal-medium.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="overflow-x-hidden antialiased">
    <div class="sketch-app" data-sketch-dialog="true" tabindex="-1">

      <!-- ===== TOP TOOLBAR ===== -->
      <div class="sketch-toolbar">
        <div class="sketch-toolbar-group">
          <a class="sketch-btn" href="/" title="Home" aria-label="Home">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </a>
          <div class="sketch-divider"></div>
          <button class="sketch-btn" id="sketch-undo" title="Undo" aria-label="Undo">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
          </button>
          <button class="sketch-btn" id="sketch-redo" title="Redo" aria-label="Redo">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg>
          </button>
        </div>

        <div class="sketch-toolbar-group">
          <button class="sketch-btn sketch-zoom" id="sketch-zoom" title="Zoom" style="min-width:80px;"><span id="sketch-zoom-text">100%</span></button>
        </div>

        <div class="sketch-toolbar-group">
          <button class="sketch-btn" id="sketch-brush-toggle" title="Brush Settings" aria-label="Brush Settings">
            <span class="sketch-btn-dot"></span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
          </button>
          <button class="sketch-btn" id="sketch-clear" title="Clear" aria-label="Clear">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
          <div class="sketch-divider"></div>
          <button class="sketch-btn sketch-btn--primary" id="sketch-export">保存导出</button>
        </div>
      </div>

      <!-- ===== BRUSH SETTINGS PANEL ===== -->
      <div class="sketch-panel" id="sketch-panel">
        <div class="sketch-panel-title">
          <h2>笔刷设置</h2>
          <button class="sketch-panel-close" id="sketch-panel-close" aria-label="Close">✕</button>
        </div>
        <div class="sketch-panel-body">
          <label class="sketch-field">
            <span class="sketch-field-label">粗细 <em id="sketch-size-val">6</em></span>
            <input type="range" id="sketch-size" min="1" max="80" value="6" />
          </label>
          <label class="sketch-field">
            <span class="sketch-field-label">不透明度 <em id="sketch-opacity-val">100%</em></span>
            <input type="range" id="sketch-opacity" min="5" max="100" value="100" />
          </label>
          <div class="sketch-field">
            <span class="sketch-field-label">颜色</span>
            <div class="sketch-swatches" id="sketch-swatches"></div>
          </div>
          <label class="sketch-field sketch-field--row">
            <span class="sketch-field-label">自定义</span>
            <input type="color" id="sketch-color" value="#ffffff" />
          </label>
        </div>
      </div>

      <!-- ===== BOTTOM TOOL DOCK ===== -->
      <div class="sketch-dock">
        <button class="sketch-tool is-active" data-tool="brush" title="Brush" aria-label="Brush">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/></svg>
        </button>
        <button class="sketch-tool" data-tool="eraser" title="Eraser" aria-label="Eraser">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16a2 2 0 0 1 0-3l9-9a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 8"/></svg>
        </button>
        <button class="sketch-tool" data-tool="line" title="Line" aria-label="Line">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/></svg>
        </button>
        <span class="sketch-dock-color" id="sketch-dock-color" title="Current color"></span>
      </div>

      <div class="sketch-credit">© LML DESIGN, INC. 自研产品</div>

      <canvas id="sketch-canvas" class="sketch-canvas"></canvas>
    </div>

    <script type="module" src="/src/sketch-main.ts"></script>
  </body>
</html>
